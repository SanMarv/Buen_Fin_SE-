networks:
  db:
    driver: bridge

services:
  postres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "${DB_HOST}:${DB_PORT}:5432"
    networks:
      - db
    volumes:
      - ${PWD}src/services/db/.data:/data/postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /data/postgres
      POSTGRES_DB: ${DB_NAME}
