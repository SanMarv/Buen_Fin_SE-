networks:
  db:
    driver: bridge

  image-service:
    driver: bridge

  frontend:
    driver: bridge

  backend:
    driver: bridge
name: buen-fin-app

services:
  image-service:
    build:
      dockerfile: ./docker-images/image-service/image-service.Dockerfile
    environment:
      PORT: 4001
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db-postgres:5432/${DB_NAME}
      S3_URL: http://host.docker.internal:9000
      DOMAIN: https://nicolas-amaya.dev
    networks:
      - image-service
      - db

  frontend:
    build:
      dockerfile: ./docker-images/frontend/frontend.Dockerfile
    environment:
      DOMAIN: https://nicolas-amaya.dev
    networks:
      - frontend


  db-postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "${DB_HOST}:${DB_PORT}:5432"
    networks:
      - db
    volumes:
      - ${PWD}/src/services/db/.data:/data/postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /data/postgres
      POSTGRES_DB: ${DB_NAME}

  backend:
    build:
      dockerfile: ./docker-images/backend/backend.Dockerfile
    environment:
      S3_URL: http://host.docker.internal:9000
      DB_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db-postgres:5432/${DB_NAME}
      DOMAIN: https://nicolas-amaya.dev
    networks:
      - backend
      - db

  proxy:
    image: nginx:latest
    depends_on: [image-service,db-postgres,frontend,backend]
    volumes:
      - ${PWD}/src/config/nginx/https.nginx.conf:/etc/nginx/nginx.conf
      - ${PWD}/src/config/nginx/server.nginx.conf:/etc/nginx/server.nginx.conf
      - ${PWD}/buen-fin.cer:/etc/nginx/ssl_cert.cer
      - ${PWD}/buen-fin.key:/etc/nginx/ssl_cert.key
    ports:
      - "443:443"
      - "80:80"
    networks:
      - db
      - image-service
      - frontend
      - backend
