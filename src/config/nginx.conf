user  nginx;

worker_processes  auto;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      '';
# }
http {

  upstream bucket {
    server bucket.nicolas-amaya.com:443;
  }

  upstream image-service {
    server image-service:4001;
  }

  server {
    listen 8080;
    location = /image/upload {
      client_max_body_size 0;

      limit_except POST {
          deny all;
      }
      proxy_set_header X-User-Id "00000000-0000-0000-0000-000000000000";

      proxy_pass http://image-service/image;
    }

    location ~ ^/images/([^/]+)/(.+)$ {
        proxy_ssl_server_name on;
        proxy_ssl_name bucket.nicolas-amaya.com;

        proxy_set_header Host bucket.nicolas-amaya.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_pass https://bucket/$1/$2;
    }
  }

}
