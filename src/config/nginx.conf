user  nginx;

worker_processes  auto;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      '';
# }
http {

  upstream bucket {
    server host.docker.internal:9000;
  }

  upstream image-service {
    server image-service:4001;
  }

  server {
    listen 8080;
    location = /image/upload {
      client_max_body_size 0;

      limit_except POST {
          deny all;
      }
      proxy_set_header X-User-Id "00000000-0000-0000-0000-000000000000";

      proxy_pass http://image-service/image;
    }

    location ~ ^/images/([^/]+)/(.+)$ {

        proxy_pass http://bucket/$1/$2;
    }
  }

}
