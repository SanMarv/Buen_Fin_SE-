user  nginx;

worker_processes  auto;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      '';
# }
http {

  upstream bucket {
    server host.docker.internal:9000;
  }

  upstream backend {
    server host.docker.internal:3001;
  }

  upstream image-service {
    server image-service:4001;
  }

  server {
    listen 8080;
    location = /api {
        return 301 /api/;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend;
    }
    # internal locations
    location = /_auth_image_upload_ {
        internal;
        client_max_body_size 0;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass http://backend/auth/images/upload;
    }
    location = /_auth_profile_update_ {
        internal;
        client_max_body_size 0;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass http://backend/companies/profile-validate;
    }

    # Hide internal request
    location = /auth/images/upload {
        return 403 "Unouthorized Request";
    }
    location = /auth/companies/profile-validate {
      return 403 "Unouthorized Request";
    }

    location ~ ^/images/([^/]+)/(.+)$ {
        proxy_pass http://bucket/$1/$2;
    }

    location ~ ^/profiles/(.+)$ {
        proxy_pass http://bucket/profiles/$1;
    }
    location = /image/upload {
      limit_except POST {
          deny all;
      }
      client_max_body_size 0;
      auth_request /_auth_image_upload_;

      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $auth_token $upstream_http_x_signature;

      proxy_set_header x-user-id $user_id;
      proxy_set_header x-signature $auth_token;

      proxy_pass http://image-service/image;
    }
    location = /profile {
      limit_except PUT DELETE {
          deny all;
      }
      client_max_body_size 0;
      auth_request /_auth_profile_update_;

      auth_request_set $company $upstream_http_x_company;
      auth_request_set $auth_token $upstream_http_x_signature;

      proxy_set_header x-company $company;
      proxy_set_header x-signature $auth_token;

      proxy_pass http://image-service/profile;
    }
  }
}
