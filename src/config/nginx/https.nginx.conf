user  nginx;

worker_processes  auto;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}


http {
  map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      '';
  }

  upstream bucket {
    server host.docker.internal:9000;
  }

  upstream backend {
    server backend:3000;
  }

  upstream image-service {
    server image-service:4001;
  }

  upstream frontend {
    server frontend:80;
  }

  server {
    listen 80;
    server_name localhost nicolas-amaya.dev www.nicolas-amaya.dev;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name localhost nicolas-amaya.dev www.nicolas-amaya.dev;

    ssl_certificate /etc/nginx/ssl_cert.cer;
    ssl_certificate_key /etc/nginx/ssl_cert.key;

    include /etc/nginx/server.nginx.conf;

    location / {
      proxy_pass http://frontend;
    }
    error_page 404 http://frontend/404;
  }

}
