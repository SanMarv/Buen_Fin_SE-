  location = /back {
      return 301 /back/;
  }
  location /back/ {
      rewrite ^/back/(.*)$ /$1 break;
      proxy_intercept_errors on;
      proxy_pass http://backend;
      error_page 404 = /error;
  }
  location = /error {
    internal;
    proxy_pass http://frontend;
  }
  # internal locations
  location = /_auth_image_upload_ {
      internal;
      client_max_body_size 0;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_pass http://backend/auth/images/upload;
  }
  location = /_auth_image_visibility_ {
      internal;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_pass http://backend/auth/images/$bucket_name/$image_path;
  }
  location = /_auth_profile_update_ {
      internal;
      client_max_body_size 0;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Original-URI $request_uri;
      proxy_pass http://backend/companies/profile-validate;
  }

  # Hide internal request
  location = /auth/images/upload {
      return 403 "Unouthorized Request";
  }
  location = /auth/companies/profile-validate {
    return 403 "Unouthorized Request";
  }
  location  /_image_read_ {
    internal;
    auth_request /_auth_image_visibility_;
    proxy_pass http://bucket/$bucket_name/$image_path;
  }
  location ~ ^/images/(?<bucket_name>[^/]+)/(?<image_path>.+)$ {
    if ($request_method = GET){
      rewrite ^ /_image_read_/$bucket_name/$image_path last;
    }
    proxy_pass http://backend/auth/images/$bucket_name/$image_path;
  }

  location = /image/upload {
    limit_except POST {
        deny all;
    }
    client_max_body_size 0;
    auth_request /_auth_image_upload_;

    auth_request_set $user_id $upstream_http_x_user_id;
    auth_request_set $auth_token $upstream_http_x_signature;

    proxy_set_header x-user-id $user_id;
    proxy_set_header x-signature $auth_token;

    proxy_pass http://image-service/image;
  }

  location ~ ^/image/upload/(?<post_id>[^/]+)$ {
    limit_except POST {
        deny all;
    }
    client_max_body_size 0;
    auth_request /_auth_image_upload_;

    auth_request_set $user_id $upstream_http_x_user_id;
    auth_request_set $auth_token $upstream_http_x_signature;

    proxy_set_header x-user-id $user_id;
    proxy_set_header x-signature $auth_token;

    proxy_pass http://image-service/image/$post_id;
  }

  location = /profile {
    limit_except PUT DELETE {
        deny all;
    }
    client_max_body_size 0;
    auth_request /_auth_profile_update_;

    auth_request_set $company $upstream_http_x_company;
    auth_request_set $auth_token $upstream_http_x_signature;

    proxy_set_header x-company $company;
    proxy_set_header x-signature $auth_token;

    proxy_pass http://image-service/profile;
  }
